<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #aaa7a7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container{
            background-color: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            width: 300px;
        }
        .login-container h2{
            text-align: center;
            color: forestgreen;
            margin-bottom: 20px;
        }
        .login-container input{
            width: 92%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-container button {
            color: white;
            background-color: #0bb7ec;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-container button:hover{
            background-color: #45a049;
        }
        
        .error{
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        
    </style>

</head>
<body>
    <div class="login-container">
        <h2>Acesso ao sistema</h2>
        <input type="text" id="username" placeholder="Usuário">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>

        <div id="error-message" class="error"></div>
    </div>
 
    <!--interacao com javascript-->
    <script>
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;
            var errorMessage = document.getElementById("error-message");

            if (username === "" || password === ""){
                errorMessage.textContent = "Preencha todos os campos!";
                return;
            }
            //validação simples: usuario = "aluno" e senha = "12345"
            if (username === "aluno" && password === "12345"){
                errorMessage.textContent = "";

                var novaAba = window.open("", "_blank");
                novaAba.document.write("<h1 style='text-align:center; margin-top:50px; color: yellow; background-color: black'>Bem vindo!</h1>");
            }

            else {
                errorMessage.textContent = "Usuário ou senha incorretos!";
            }
        }
    </script>
</body>
</html>
