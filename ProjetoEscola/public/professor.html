<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">caderno.digital</div>
            <div class="user-profile">
                <div class="avatar"><i class="fas fa-chalkboard-teacher"></i></div>
                <div class="user-info"><strong id="nome-usuario"></strong><br><small>Professor</small></div>
            </div>
            <nav class="menu">
                <div class="menu-item active" onclick="abrirAba('turmas', this)"><i class="fas fa-home"></i> Minhas
                    Turmas</div>
                <div class="menu-item" onclick="abrirAba('diarios', this)"><i class="fas fa-book-open"></i> Diário de Classe</div>
                <div class="menu-item" onclick="abrirAba('frequencia', this)"><i class="fas fa-user-check"></i> Frequência</div>
                <div class="menu-item" onclick="abrirAba('notas', this)"><i class="fas fa-chart-line"></i> Notas</div>
                <div class="menu-item" onclick="abrirAba('relatorios', this)"><i class="fas fa-file-alt"></i> Relatórios</div>
            </nav>
            <div class="logout-btn" onclick="sair()">Sair</div>
        </aside>
        <main class="main-content">
            <header class="top-bar" style="justify-content:space-between; padding:16px 32px;">
                <div class="breadcrumb"><strong>Portal Escolar</strong> <span>/</span> Área do Professor</div>
                <div style="display:flex;align-items:center;gap:14px;color:#6d7b87;font-size:12px;"><i class="fas fa-bell"></i><span id="topbar-date"></span><strong id="topbar-name"></strong></div>
            </header>
            <div class="content-area" id="conteudo-principal">
                <div class="empty-state">Carregando seu espaço de trabalho...</div>
            </div>
        </main>
    </div>
    <script src="auth.js"></script>
    <script src="script-professor.js"></script>
</body>

</html>
