<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CadernoDigital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="login-box">
        <h1><i class="fas fa-book-open"></i> CadernoDigital</h1>
        <p>Faça login para continuar</p>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button onclick="login()">Entrar</button>
        <p id="erro" class="erro"></p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erro');
            erro.textContent = '';
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (!response.ok) { erro.textContent = data.message; return; }
                localStorage.setItem('token', data.token);
                localStorage.setItem('papel', data.papel);
                localStorage.setItem('nome', data.nome);
                if (data.papel === 'diretor' || data.papel === 'direcao') window.location.href = 'diretor.html';
                else if (data.papel === 'professor') window.location.href = 'professor.html';
                else { alert('Acesso restrito'); localStorage.clear(); }
            } catch (err) { erro.textContent = 'Erro de conexão. Verifique se o servidor está rodando.'; }
        }
    </script>
</body>

</html>
