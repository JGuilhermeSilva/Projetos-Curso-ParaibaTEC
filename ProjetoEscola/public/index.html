<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CadernoDigital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-body">
    <div class="login-shell">
        <section class="login-brand">
            <h1><span class="brand-mark">▦</span> caderno<span>digital</span></h1>
            <p>Gestão escolar simples, segura e conectada. Acompanhe turmas, frequência, notas e documentos em um só lugar.</p>
        </section>
        <form class="login-box" onsubmit="event.preventDefault(); login();">
            <h1><i class="fas fa-lock"></i> Acesso ao sistema</h1>
            <p>Entre com seus dados para continuar</p>
            <label for="email">Usuário</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="username" required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="submit"><i class="fas fa-arrow-right"></i> Acessar</button>
            <p id="erro" class="erro" role="alert"></p>
        </form>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const erro = document.getElementById('erro');
            erro.textContent = '';
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const data = await response.json();
                if (!response.ok) { erro.textContent = data.message; return; }
                localStorage.setItem('token', data.token);
                localStorage.setItem('papel', data.papel);
                localStorage.setItem('nome', data.nome);
                if (data.papel === 'diretor' || data.papel === 'direcao') window.location.href = 'diretor.html';
                else if (data.papel === 'professor') window.location.href = 'professor.html';
                else { alert('Acesso restrito'); localStorage.clear(); }
            } catch (err) { erro.textContent = 'Erro de conexão. Verifique se o servidor está rodando.'; }
        }
    </script>
</body>

</html>
